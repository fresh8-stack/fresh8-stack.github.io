<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Origen de Alimentos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
        }

        .header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: var(--primary-dark);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin: 0;
        }

        #reader {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            background: #000;
            border: none;
        }

        #result-box {
            margin-top: 20px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 16px;
            text-align: left;
            display: none;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .country-badge {
            background: #dcfce7;
            color: #166534;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 1.15rem;
            font-weight: bold;
            margin-top: 10px;
            display: inline-block;
            border: 1px solid #bbf7d0;
        }

        .btn-action {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-paypal {
            background: #ffc439;
            color: #003087;
            margin-top: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .loading {
            color: #d97706;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
        }

        img.product-img {
            max-width: 120px;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔍 Escáner de Origen</h1>
        <p class="subtitle">Apunta al código de barras del producto</p>
    </div>

    <!-- Escáner -->
    <div id="reader"></div>

    <!-- Resultados -->
    <div id="result-box"></div>

    <!-- Botón Donación PayPal -->
    <a href="https://www.paypal.me/BuyMeACoffeeApp" target="_blank" class="btn-action btn-paypal">
        ☕ Invítame a un café
    </a>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        const eanPrefixes = {
            "84": "España",
            "885": "Tailandia",
            "80": "Italia", "81": "Italia", "82": "Italia", "83": "Italia",
            "30": "Francia", "31": "Francia", "32": "Francia", "33": "Francia", "34": "Francia", "35": "Francia", "36": "Francia", "37": "Francia",
            "40": "Alemania", "41": "Alemania", "42": "Alemania", "43": "Alemania", "44": "Alemania",
            "50": "Reino Unido",
            "750": "México",
            "779": "Argentina",
            "690": "China", "691": "China", "692": "China", "693": "China", "694": "China", "695": "China",
            "00": "EE. UU. / Canadá", "01": "EE. UU. / Canadá", "02": "EE. UU. / Canadá", "03": "EE. UU. / Canadá", "04": "EE. UU. / Canadá", "05": "EE. UU. / Canadá", "06": "EE. UU. / Canadá", "07": "EE. UU. / Canadá", "08": "EE. UU. / Canadá", "09": "EE. UU. / Canadá"
        };

        function getCountryFromEAN(barcode) {
            for (let prefix in eanPrefixes) {
                if (barcode.startsWith(prefix)) {
                    return eanPrefixes[prefix];
                }
            }
            return "Desconocido (por EAN)";
        }

        function cleanCountryName(text) {
            if (!text) return null;
            return text.replace(/en:/g, '').replace(/es:/g, '').replace(/-/g, ' ').toUpperCase();
        }

        async function fetchProductInfo(barcode) {
            const resultBox = document.getElementById("result-box");
            resultBox.style.display = "block";
            resultBox.innerHTML = `<p class="loading">🔍 Buscando origen del código ${barcode}...</p>`;

            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                const data = await response.json();

                let brandCountry = getCountryFromEAN(barcode);

                if (data.status === 1) {
                    const product = data.product;
                    const name = product.product_name || "Producto escaneado";
                    const origins = cleanCountryName(product.origins || product.manufacturing_places) || brandCountry;

                    resultBox.innerHTML = `
                        <h2>${name}</h2>
                        <div class="country-badge">📍 PAÍS: ${origins}</div>
                        <p style="margin-top: 15px;"><strong>Código de barras:</strong> ${barcode}</p>
                        <p><strong>Registro EAN:</strong> ${brandCountry}</p>
                        ${product.image_front_url ? `<img src="${product.image_front_url}" class="product-img">` : ''}
                        <button onclick="restartScanner()" class="btn-action">📷 Escanear otro producto</button>
                    `;
                } else {
                    resultBox.innerHTML = `
                        <h2>Producto no registrado</h2>
                        <div class="country-badge">📍 MARCA REGISTRADA EN: ${brandCountry}</div>
                        <p style="margin-top: 15px;"><strong>Código de barras:</strong> ${barcode}</p>
                        <button onclick="restartScanner()" class="btn-action">📷 Escanear otro producto</button>
                    `;
                }
            } catch (error) {
                resultBox.innerHTML = `
                    <p class="error">Error al conectar con la base de datos.</p>
                    <button onclick="restartScanner()" class="btn-action">Reintentar</button>
                `;
            }
        }

        let html5QrcodeScanner;

        function onScanSuccess(decodedText) {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear();
            }
            fetchProductInfo(decodedText);
        }

        function startScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 10, 
                    qrbox: { width: 250, height: 150 },
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
                },
                false
            );
            html5QrcodeScanner.render(onScanSuccess);
        }

        function restartScanner() {
            document.getElementById("result-box").style.display = "none";
            startScanner();
        }

        startScanner();
    </script>
</body>
</html>

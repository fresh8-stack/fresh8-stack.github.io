<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW error:', err));
    }

    const eanPrefixes = {
        "84": "España",
        "885": "Tailandia",
        "80": "Italia", "81": "Italia", "82": "Italia", "83": "Italia",
        "30": "Francia", "31": "Francia", "32": "Francia", "33": "Francia", "34": "Francia", "35": "Francia", "36": "Francia", "37": "Francia",
        "40": "Alemania", "41": "Alemania", "42": "Alemania", "43": "Alemania", "44": "Alemania",
        "50": "Reino Unido",
        "750": "México",
        "779": "Argentina",
        "690": "China", "691": "China", "692": "China", "693": "China", "694": "China", "695": "China",
        "00": "EE. UU. / Canadá", "01": "EE. UU. / Canadá", "02": "EE. UU. / Canadá", "03": "EE. UU. / Canadá",
        "04": "EE. UU. / Canadá", "05": "EE. UU. / Canadá", "06": "EE. UU. / Canadá", "07": "EE. UU. / Canadá",
        "08": "EE. UU. / Canadá", "09": "EE. UU. / Canadá"
    };

    function getCountryFromEAN(barcode) {
        for (let prefix in eanPrefixes) {
            if (barcode.startsWith(prefix)) {
                return eanPrefixes[prefix];
            }
        }
        return "Desconocido (por EAN)";
    }

    function cleanCountryName(text) {
        if (!text) return null;
        let clean = text.replace(/en:/g, '').replace(/es:/g, '').replace(/-/g, ' ');
        return clean.charAt(0).toUpperCase() + clean.slice(1);
    }

    let html5QrCode = null;
    let isProcessing = false;
    let isScannerRunning = false;

    async function fetchProductInfo(barcode) {
        const resultBox = document.getElementById("result-box");
        resultBox.style.display = "block";
        resultBox.innerHTML = `<p class="loading">🔍 Buscando origen del código ${barcode}...</p>`;

        try {
            const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
            const data = await response.json();
            let brandCountry = getCountryFromEAN(barcode);

            if (data.status === 1) {
                const product = data.product;
                const name = product.product_name || "Producto escaneado";
                const origins = cleanCountryName(product.origins || product.manufacturing_places) || brandCountry;

                resultBox.innerHTML = `
                    <h2 style="margin:0 0 10px 0; font-size: 1.3rem;">${name}</h2>
                    <div class="country-badge">📍 PAÍS: ${origins}</div>
                    <p style="margin-top: 15px; margin-bottom: 5px;"><strong>Código:</strong> ${barcode}</p>
                    <p style="margin: 0;"><strong>Registro EAN:</strong> ${brandCountry}</p>
                    ${product.image_front_url ? `<img src="${product.image_front_url}" class="product-img" loading="lazy">` : ''}
                    <button onclick="restartScanner()" class="btn-action">📷 Escanear otro producto</button>
                `;
            } else {
                resultBox.innerHTML = `
                    <h2 style="margin:0 0 10px 0; font-size: 1.3rem;">Producto no registrado</h2>
                    <div class="country-badge">📍 MARCA REGISTRADA EN: ${brandCountry}</div>
                    <p style="margin-top: 15px;"><strong>Código:</strong> ${barcode}</p>
                    <button onclick="restartScanner()" class="btn-action">📷 Escanear otro producto</button>
                `;
            }
        } catch (error) {
            resultBox.innerHTML = `
                <p class="error">Error al conectar con la base de datos.</p>
                <button onclick="restartScanner()" class="btn-action">Reintentar</button>
            `;
        }
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;

        document.getElementById("scanner-container").style.display = "none";
        document.getElementById("instruction-text").style.display = "none";

        stopScanner().then(() => {
            fetchProductInfo(decodedText);
        });
    }

    async function stopScanner() {
        if (html5QrCode && isScannerRunning) {
            try {
                await html5QrCode.stop();
                await html5QrCode.clear();   // muy importante
            } catch (err) {
                console.warn("Error al parar cámara:", err);
            }
            isScannerRunning = false;
        }
    }

    async function startScanner() {
        isProcessing = false;

        document.getElementById("scanner-container").style.display = "block";
        document.getElementById("instruction-text").style.display = "block";
        document.getElementById("result-box").style.display = "none";

        // Evitar múltiples inicios
        if (isScannerRunning) return;

        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }

        // Configuración optimizada para móviles
        const config = {
            fps: 15,                          // un poco más fluido
            qrbox: function(viewfinderWidth, viewfinderHeight) {
                // Hace el área de escaneo adaptativa (mejor rendimiento)
                let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                let size = Math.floor(minEdge * 0.75);
                return { width: size, height: Math.floor(size * 0.6) };
            },
            aspectRatio: 1.777,               // 16:9
            disableFlip: false
        };

        // Limitar resolución de la cámara (esto es clave para que no vaya lenta)
        const cameraConfig = {
            facingMode: "environment",
            // Descomenta la línea de abajo si quieres forzar resolución baja
            // video: { width: { ideal: 1280 }, height: { ideal: 720 } }
        };

        try {
            await html5QrCode.start(
                cameraConfig,
                config,
                onScanSuccess,
                (errorMessage) => {
                    // silenciar errores de "no se detectó código"
                }
            );
            isScannerRunning = true;
        } catch (err) {
            console.error("Error al arrancar la cámara:", err);
            document.getElementById("instruction-text").textContent = "No se pudo acceder a la cámara. Revisa los permisos.";
        }
    }

    async function restartScanner() {
        await stopScanner();
        // Pequeña pausa para que el navegador libere el stream
        setTimeout(() => {
            startScanner();
        }, 300);
    }

    // Esperar a que todo esté listo
    document.addEventListener("DOMContentLoaded", () => {
        // Pequeño delay ayuda en algunos móviles
        setTimeout(startScanner, 400);
    });
</script>

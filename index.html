<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner de Origen de Alimentos</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 480px;
            margin: 0 auto;
            padding: 16px;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
        }

        .header {
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: var(--primary-dark);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin: 0;
        }

        #scanner-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            background: #000;
        }

        #reader {
            width: 100%;
            border: none;
        }

        #result-box {
            margin-top: 10px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 16px;
            text-align: left;
            display: none;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .country-badge {
            background: #dcfce7;
            color: #166534;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 12px;
            display: inline-block;
        }

        .btn-action {
            display: block;
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 18px;
            text-align: center;
            text-decoration: none;
        }

        .btn-kofi {
            display: inline-block;
            width: 100%;
            max-width: 260px;
            background: #ff5e5b;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin: 20px auto 0 auto;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(255, 94, 91, 0.25);
            transition: transform 0.1s ease;
        }

        .btn-kofi:active {
            transform: scale(0.97);
        }

        .loading {
            color: #d97706;
            font-weight: bold;
            text-align: center;
        }

        .error {
            color: #dc2626;
            text-align: center;
        }

        img.product-img {
            max-width: 130px;
            border-radius: 8px;
            margin-top: 12px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔍 Escáner de Origen</h1>
        <p class="subtitle" id="instruction-text">Apunta al código de barras del producto</p>
    </div>

    <!-- Contenedor del Escáner -->
    <div id="scanner-container">
        <div id="reader"></div>
    </div>

    <!-- Resultados -->
    <div id="result-box"></div>

    <!-- Botón Ko-fi Ajustado -->
    <div style="text-align: center;">
        <a href="https://ko-fi.com/buymeacoffeeapp" target="_blank" class="btn-kofi">
            ☕ Apoyar el proyecto
        </a>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW error:', err));
        }

        const eanPrefixes = {
            "84": "España",
            "885": "Tailandia",
            "80": "Italia", "81": "Italia", "82": "Italia", "83": "Italia",
            "30": "Francia", "31": "Francia", "32": "Francia", "33": "Francia", "34": "Francia", "35": "Francia", "36": "Francia", "37": "Francia",
            "40": "Alemania", "41": "Alemania", "42": "Alemania", "43": "Alemania", "44": "Alemania",
            "50": "Reino Unido",
            "750": "México",
            "779": "Argentina",
            "690": "China", "691": "China", "692": "China", "693": "China", "694": "China", "695": "China",
            "00": "EE. UU. / Canadá", "01": "EE. UU. / Canadá", "02": "EE. UU. / Canadá", "03": "EE. UU. / Canadá",
            "04": "EE. UU. / Canadá", "05": "EE. UU. / Canadá", "06": "EE. UU. / Canadá", "07": "EE. UU. / Canadá",
            "08": "EE. UU. / Canadá", "09": "EE. UU. / Canadá"
        };

        function getCountryFromEAN(barcode) {
            for (let prefix in eanPrefixes) {
                if (barcode.startsWith(prefix)) {
                    return eanPrefixes[prefix];
                }
            }
            return "Desconocido (por EAN)";
        }

        function cleanCountryName(text) {
            if (!text) return null;
            let clean = text.replace(/en:/g, '').replace(/es:/g, '').replace(/-/g, ' ');
            return clean.charAt(0).toUpperCase() + clean.slice(1);
        }

        let html5QrCode = null;
        let isProcessing = false;
        let isScannerRunning = false;

        async function fetchProductInfo(barcode) {
            const resultBox = document.getElementById("result-box");
            resultBox.style.display = "block";
            resultBox.innerHTML = `<p class="loading">🔍 Buscando origen del código ${barcode}...</p>`;

            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                const data = await response.json();
                let brandCountry = getCountryFromEAN(barcode);

                if (data.status === 1) {
                    const product = data.product;
                    const name = product.product_name || "Producto escaneado";
                    const origins = cleanCountryName(product.origins || product.manufacturing_places) || brandCountry;

                    resultBox.innerHTML = `
                        <h2 style="margin:0 0 10px 0; font-size: 1.3rem;">${name}</h2>
                        <div class="country-badge">📍 PAÍS: ${origins}</div>
                        <p style="margin-top: 15px; margin-bottom: 5px;"><strong>Código:</strong> ${barcode}</p>
                        <p style="margin: 0;"><strong>Registro EAN:</strong> ${brandCountry}</p>
                        ${product.image_front_url ? `<img src="${product.image_front_url}" class="product-img" loading="lazy">` : ''}
                        <button onclick="restartScanner()" class="btn-action">📷 Escanear otro producto</button>
                    `;
                } else {
                    resultBox.innerHTML = `
                        <h2 style="margin:0 0 10px 0; font-size: 1.3rem;">Producto no registrado</h2>
                        <div class="country-badge">📍 MARCA REGISTRADA EN: ${brandCountry}</div>
                        <p style="margin-top: 15px;"><strong>Código:</strong> ${barcode}</p>
                        <button onclick="restartScanner()" class="btn-action">📷 Escanear otro producto</button>
                    `;
                }
            } catch (error) {
                resultBox.innerHTML = `
                    <p class="error">Error al conectar con la base de datos.</p>
                    <button onclick="restartScanner()" class="btn-action">Reintentar</button>
                `;
            }
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            document.getElementById("scanner-container").style.display = "none";
            document.getElementById("instruction-text").style.display = "none";

            stopScanner().then(() => {
                fetchProductInfo(decodedText);
            });
        }

        async function stopScanner() {
            if (html5QrCode && isScannerRunning) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch (err) {
                    console.warn("Error al parar cámara:", err);
                } finally {
                    isScannerRunning = false;
                }
            }
        }

        async function startScanner() {
            isProcessing = false;

            document.getElementById("scanner-container").style.display = "block";
            document.getElementById("instruction-text").style.display = "block";
            document.getElementById("result-box").style.display = "none";

            if (isScannerRunning) return;

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = {
                fps: 15,
                qrbox: function(viewfinderWidth, viewfinderHeight) {
                    let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    let size = Math.floor(minEdge * 0.75);
                    return { width: size, height: Math.floor(size * 0.6) };
                },
                aspectRatio: 1.777,
                disableFlip: false
            };

            const cameraConfig = {
                facingMode: "environment"
            };

            try {
                await html5QrCode.start(
                    cameraConfig,
                    config,
                    onScanSuccess,
                    () => {}
                );
                isScannerRunning = true;
            } catch (err) {
                console.error("Error al arrancar la cámara:", err);
                document.getElementById("instruction-text").textContent = "No se pudo acceder a la cámara. Revisa los permisos.";
            }
        }

        async function restartScanner() {
            await stopScanner();
            setTimeout(async () => {
                await startScanner();
            }, 350);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(startScanner, 400);
        });
    </script>
</body>
</html>

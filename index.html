<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OrigenScan – Detecta el país del producto</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --success: #16a34a;
            --success-bg: #dcfce7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 700;
        }
        h1 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
        }
        .subtitle {
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 4px;
        }
        #scanner-container {
            width: 100%;
            height: 300px;
            border-radius: 18px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
            position: relative;
        }
        #reader {
            width: 100% !important;
            height: 100% !important;
        }
        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        #result-box {
            margin-top: 18px;
            padding: 22px;
            background: var(--card);
            border-radius: 18px;
            text-align: left;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }
        .product-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .country-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--success-bg);
            color: var(--success);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .info-row {
            font-size: 0.92rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .info-row strong {
            color: var(--text);
        }
        img.product-img {
            max-width: 120px;
            border-radius: 12px;
            margin: 14px 0 6px;
            display: block;
            border: 1px solid #e2e8f0;
        }
        .btn-action {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 18px;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
        }
        .btn-action:active {
            transform: scale(0.98);
        }
        .btn-kofi {
            display: block;
            width: 100%;
            max-width: 240px;
            margin: 28px auto 0;
            background: #ff5e5b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 4px 12px rgba(255, 94, 91, 0.3);
        }
        .loading {
            color: #d97706;
            font-weight: 600;
            text-align: center;
            padding: 10px 0;
        }
        .error {
            color: #dc2626;
            text-align: center;
            padding: 10px 0;
        }
        .scan-hint {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <div class="logo-icon">OS</div>
            <h1>OrigenScan</h1>
        </div>
        <p class="subtitle" id="instruction-text">Apunta al código de barras del producto</p>
    </div>

    <div id="scanner-container">
        <div id="reader"></div>
        <div class="scan-hint">Mantén el código dentro del recuadro</div>
    </div>

    <div id="result-box"></div>

    <a href="https://ko-fi.com/buymeacoffeeapp" target="_blank" class="btn-kofi">
        ☕ Apoyar el proyecto
    </a>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        // Prefijos ordenados de más largos a más cortos (importante)
        const eanPrefixes = {
            // 3 dígitos
            "611": "Marruecos",

            "84": "España",

            "30": "Francia", "31": "Francia", "32": "Francia", "33": "Francia",

            "00": "EE. UU. / Canadá", "01": "EE. UU. / Canadá", "02": "EE. UU. / Canadá",
            "03": "EE. UU. / Canadá", "04": "EE. UU. / Canadá", "05": "EE. UU. / Canadá",
            "06": "EE. UU. / Canadá", "07": "EE. UU. / Canadá", "08": "EE. UU. / Canadá", "09": "EE. UU. / Canadá"
        };

        function getCountryFromEAN(barcode) {
            // Primero intentamos con 3 dígitos, luego con 2
            if (barcode.length >= 3) {
                const p3 = barcode.substring(0, 3);
                if (eanPrefixes[p3]) return eanPrefixes[p3];
            }
            if (barcode.length >= 2) {
                const p2 = barcode.substring(0, 2);
                if (eanPrefixes[p2]) return eanPrefixes[p2];
            }
            return "Desconocido";
        }

        function cleanCountryName(text) {
            if (!text) return null;
            let clean = text.replace(/en:/gi, '').replace(/es:/gi, '').replace(/-/g, ' ').trim();
            return clean.charAt(0).toUpperCase() + clean.slice(1);
        }

        let html5QrCode = null;
        let isProcessing = false;
        let isScannerRunning = false;

        async function fetchProductInfo(barcode) {
            const resultBox = document.getElementById("result-box");
            resultBox.style.display = "block";
            resultBox.innerHTML = `<p class="loading">Buscando información del producto...</p>`;

            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                const data = await response.json();
                const brandCountry = getCountryFromEAN(barcode);

                if (data.status === 1) {
                    const product = data.product;
                    const name = product.product_name || "Producto escaneado";
                    const origins = cleanCountryName(product.origins || product.manufacturing_places) || brandCountry;

                    resultBox.innerHTML = `
                        <div class="product-name">${name}</div>
                        <div class="country-badge">📍 ${origins}</div>
                        <div class="info-row"><strong>Código:</strong> ${barcode}</div>
                        <div class="info-row"><strong>Registro EAN:</strong> ${brandCountry}</div>
                        ${product.image_front_url ? `<img src="${product.image_front_url}" class="product-img" loading="lazy">` : ''}
                        <button onclick="restartScanner()" class="btn-action">Escanear otro producto</button>
                    `;
                } else {
                    resultBox.innerHTML = `
                        <div class="product-name">Producto no registrado</div>
                        <div class="country-badge">📍 ${brandCountry}</div>
                        <div class="info-row"><strong>Código:</strong> ${barcode}</div>
                        <div class="info-row">Solo se pudo determinar el país por el prefijo EAN.</div>
                        <button onclick="restartScanner()" class="btn-action">Escanear otro producto</button>
                    `;
                }
            } catch (error) {
                resultBox.innerHTML = `
                    <p class="error">Error de conexión con la base de datos.</p>
                    <button onclick="restartScanner()" class="btn-action">Reintentar</button>
                `;
            }
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            document.getElementById("scanner-container").style.display = "none";
            document.getElementById("instruction-text").style.display = "none";

            stopScanner().then(() => fetchProductInfo(decodedText));
        }

        async function stopScanner() {
            if (html5QrCode && isScannerRunning) {
                try {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                } catch (e) {}
                finally {
                    isScannerRunning = false;
                }
            }
        }

        async function startScanner() {
            isProcessing = false;
            document.getElementById("scanner-container").style.display = "block";
            document.getElementById("instruction-text").style.display = "block";
            document.getElementById("result-box").style.display = "none";

            if (isScannerRunning) return;

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = {
                fps: 12,
                qrbox: { width: 260, height: 140 },
                aspectRatio: 1.777
            };

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    () => {}
                );
                isScannerRunning = true;
            } catch (err) {
                console.error(err);
                document.getElementById("instruction-text").textContent = "No se pudo acceder a la cámara";
            }
        }

        async function restartScanner() {
            await stopScanner();
            setTimeout(startScanner, 400);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(startScanner, 500);
        });
    </script>
</body>
</html>
